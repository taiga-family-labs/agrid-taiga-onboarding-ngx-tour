<aside class="sidebar">
    <header class="header">
        <h2>Комментарии</h2>

        <button
            appearance="flat"
            aria-label="Закрыть сайдбар"
            iconStart="@tui.x"
            size="m"
            tuiIconButton
            type="button"
            (click)="closed.emit()"
        ></button>
    </header>

    <div class="proposal-summary">
        <span class="avatar">{{ proposal().employeeFullName.slice(0, 1) }}</span>
        <strong>{{ proposal().employeeFullName }}</strong>
    </div>

    <tui-segmented
        size="m"
        [tourAnchor]="commentTour ? anchors.tabs : ''"
        [(activeItemIndex)]="activeSegment"
    >
        <button type="button">Все</button>
        <button type="button">Обоснования</button>
        <button type="button">Другие комментарии</button>
    </tui-segmented>

    <section class="comments-empty">
        <div class="empty-icon">✦</div>
        <p>Комментариев по сотруднику пока нет</p>
    </section>

    <comment-form [proposal]="proposal()" />
</aside>
