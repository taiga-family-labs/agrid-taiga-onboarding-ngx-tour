<tui-root>
    <main class="page">
        <header class="toolbar">
            <div>
                <h1 tuiTitle>
                    Пересмотр компенсаций
                    <span tuiSubtitle>Прототип AG Grid + Taiga UI на ngx-ui-tour</span>
                </h1>
            </div>

            <button
                appearance="outline"
                size="m"
                tuiButton
                type="button"
                [disabled]="commentTour === null"
                (click)="startTour(true)"
            >
                Запустить онбординг
            </button>
        </header>

        <div class="workspace" [class.sidebar-open]="sidebar.opened()">
            <section class="grid-shell">
                <div class="grid-toolbar">
                    <span>Перетащите сюда для группировки по строкам</span>
                    <span>{{ rowData.length }} заявок</span>
                </div>

                <ag-grid-angular
                    class="ag-theme-quartz grid"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [rowData]="rowData"
                    [rowHeight]="48"
                    [theme]="'legacy'"
                    (firstDataRendered)="onFirstDataRendered()"
                    (gridReady)="onGridReady($event)"
                />
            </section>

            @if (sidebar.proposal(); as proposal) {
                <comments-sidebar
                    [proposal]="proposal"
                    (closed)="closeSidebar()"
                />
            }
        </div>
    </main>

    @if (commentTour) {
        <tour-step-template>
            <ng-template let-step="step">
                <comment-tour-template [step]="step" />
            </ng-template>
        </tour-step-template>
    }
</tui-root>
